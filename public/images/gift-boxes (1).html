<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hộp Quà</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --purple: #7c3aed;
    --purple-light: #a78bfa;
    --purple-dark: #4c1d95;
    --orange: #f59e0b;
    --gold: #fbbf24;
    --bg: #08071a;
    --card-bg: rgba(15,10,40,.96);
    --card-border: rgba(139,92,246,.35);
    --text: #f0f0ff;
    --text-muted: #a0a0c0;
  }

  body {
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Space Grotesk', sans-serif;
    color: var(--text);
    overflow-x: hidden;
    padding: 40px 20px;
  }

  /* Ambient background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 50% at 20% 30%, rgba(88,28,220,.18) 0%, transparent 60%),
      radial-gradient(ellipse 50% 60% at 80% 70%, rgba(167,40,200,.12) 0%, transparent 60%),
      radial-gradient(ellipse 40% 40% at 50% 50%, rgba(76,29,149,.08) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  /* Floating stars */
  .stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }
  .star {
    position: absolute;
    border-radius: 50%;
    background: white;
    animation: twinkle var(--dur, 3s) ease-in-out infinite var(--delay, 0s);
  }
  @keyframes twinkle {
    0%, 100% { opacity: .15; transform: scale(1); }
    50% { opacity: .8; transform: scale(1.4); }
  }

  .scene {
    position: relative;
    z-index: 1;
    display: flex;
    gap: 28px;
    align-items: flex-start;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 1040px;
    width: 100%;
  }

  /* ── CARD ── */
  .gcard {
    position: relative;
    width: 300px;
    border-radius: 20px;
    background: var(--card-bg);
    border: 1.5px solid var(--card-border);
    overflow: hidden;
    cursor: pointer;
    transition: transform .4s cubic-bezier(.34,1.56,.64,1), box-shadow .4s ease;
    animation: cardIn .6s cubic-bezier(.34,1.56,.64,1) both;
  }
  .gcard:nth-child(1) { animation-delay: .0s; }
  .gcard:nth-child(2) { animation-delay: .12s; }
  .gcard:nth-child(3) { animation-delay: .24s; }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(40px) scale(.92); }
    to   { opacity: 1; transform: translateY(0)   scale(1); }
  }

  .gcard:hover {
    transform: translateY(-10px) scale(1.025);
    box-shadow: 0 30px 80px rgba(109,40,217,.45), 0 0 0 1px rgba(167,139,250,.3);
  }

  /* Shimmer sweep */
  .gcard::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(110deg, transparent 30%, rgba(255,255,255,.06) 50%, transparent 70%);
    transform: translateX(-100%);
    transition: transform .6s ease;
    pointer-events: none;
    z-index: 10;
  }
  .gcard:hover::after { transform: translateX(100%); }

  /* Tier-specific glow */
  .gcard.unlucky { --glow: rgba(109,40,217,.3); }
  .gcard.normal  { --glow: rgba(34,197,94,.3); }
  .gcard.vip     { --glow: rgba(251,191,36,.35); }

  .gcard:hover { box-shadow: 0 30px 80px var(--glow), 0 0 0 1px rgba(167,139,250,.25); }

  /* ── OPENED CHIP ── */
  .chip {
    position: absolute;
    top: 14px;
    right: 14px;
    z-index: 20;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .12em;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: 20px;
    background: rgba(255,255,255,.1);
    border: 1px solid rgba(255,255,255,.15);
    backdrop-filter: blur(8px);
    color: rgba(255,255,255,.7);
  }

  /* ── IMAGE AREA ── */
  .img-shell {
    position: relative;
    width: 100%;
    height: 200px;
    overflow: hidden;
    background: linear-gradient(160deg, rgba(60,20,120,.9) 0%, rgba(20,10,50,.95) 100%);
    display: block;

  }

  .img-shell img {
    width: 100%; height: 100%;
    object-fit: cover; display: block;
    position: absolute; inset: 0;
    transition: transform .65s cubic-bezier(.25,.46,.45,.94), filter .4s ease;
    filter: brightness(.82) saturate(1.1);
  }
  .gcard:hover .img-shell img {
    transform: scale(1.12);
    filter: brightness(1.08) saturate(1.45);
  }

  /* Gradient overlay */
  .img-shell::after {
    content: ''; position: absolute;
    bottom: 0; left: 0; right: 0; height: 70%;
    background: linear-gradient(to top, rgba(15,10,40,1) 0%, transparent 100%);
    pointer-events: none; z-index: 2;
  }

  /* Tier color glow overlay on hover */
  .img-glow {
    position: absolute; inset: 0; z-index: 3;
    opacity: 0; transition: opacity .45s ease; pointer-events: none;
  }
  .gcard.normal .img-glow  { background: radial-gradient(ellipse 80% 65% at 50% 38%, rgba(34,197,94,.22) 0%, transparent 70%); }
  .gcard.vip    .img-glow  { background: radial-gradient(ellipse 80% 65% at 50% 38%, rgba(251,191,36,.26) 0%, transparent 70%); }
  .gcard:hover  .img-glow  { opacity: 1; }

  /* Light scan sweep on hover */
  .img-scan {
    position: absolute; inset: 0; z-index: 4;
    pointer-events: none; overflow: hidden;
  }
  .gcard:hover .img-scan::after {
    content: '';
    position: absolute; top: 0; width: 55%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.11), transparent);
    animation: scanSwipe .6s ease-out forwards;
  }
  @keyframes scanSwipe { from{left:-60%} to{left:140%} }

  /* Emoji fallback */
  .emoji-fallback {
    font-size: 72px; position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { transform: scale(1); }
    50%      { transform: scale(1.08); }
  }

  /* ── UNLUCKY: emoji 😭 + flowing tears ── */
  .cry-shell {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; cursor: pointer;
    background: radial-gradient(ellipse 80% 80% at 50% 52%, #1e0c44 0%, #08071a 100%);
  }
  /* dot grid bg */
  .cry-shell::before {
    content: ''; position: absolute; inset: 0;
    background-image: radial-gradient(circle, rgba(167,139,250,.45) 1px, transparent 1px);
    background-size: 28px 28px; opacity: .1; pointer-events: none;
  }

  /* Emoji */
  .cry-emoji {
    font-size: 108px; line-height: 1; position: relative; z-index: 5;
    user-select: none;
    transition: transform .4s cubic-bezier(.34,1.56,.64,1), filter .4s ease;
    filter: drop-shadow(0 4px 24px rgba(109,40,217,.6));
    animation: cryBob 2.8s ease-in-out infinite;
  }
  .cry-shell:hover .cry-emoji {
    transform: scale(1.44);
    filter: drop-shadow(0 6px 48px rgba(139,92,246,1)) drop-shadow(0 0 30px rgba(167,139,250,.7));
    animation: none;
  }
  @keyframes cryBob {
    0%,100% { transform: translateY(0) rotate(-1.5deg); }
    50%      { transform: translateY(-7px) rotate(1.5deg); }
  }

  /* Tear streams — stroke-dashoffset draw-on technique */
  /* Stream appears to flow down from eye, not fall from sky */
  .tc {
    fill: none;
    stroke-linecap: round;
    stroke-dasharray: var(--len, 60);
    stroke-dashoffset: var(--len, 60);
    animation: flowDown var(--d,2.2s) ease-in-out infinite var(--s,0s);
  }
  /* Normal: 1 stream per side, slow */
  @keyframes flowDown {
    0%   { stroke-dashoffset: var(--len,60); opacity:0; }
    6%   { opacity:1; }
    40%  { stroke-dashoffset: 0; opacity:1; }
    78%  { stroke-dashoffset: 0; opacity:.9; }
    100% { stroke-dashoffset: calc(var(--len,60) * -1); opacity:0; }
  }
  /* Hover: faster, more streams */
  .cry-shell:hover .tc {
    animation-duration: calc(var(--d,2.2s) * .35);
  }
  /* Extra streams — hidden normally, show on hover */
  .tc-x {
    fill: none;
    stroke-linecap: round;
    stroke-dasharray: var(--len, 50);
    stroke-dashoffset: var(--len, 50);
    opacity: 0;
  }
  .cry-shell:hover .tc-x {
    animation: flowDown calc(var(--d,2.2s) * .32) ease-in-out infinite var(--s,0s);
  }

  /* Puddle */
  .cry-puddle {
    position:absolute; bottom:0; left:8%; right:8%;
    height:0; opacity:0;
    background: linear-gradient(to top, rgba(96,165,250,.28), transparent);
    border-radius:50%; transition:height .5s, opacity .5s;
  }
  .cry-shell:hover .cry-puddle { height:38px; opacity:1; }

  /* Vignette */
  .cry-vignette {
    position:absolute; inset:0; pointer-events:none; z-index:4;
    background: radial-gradient(ellipse 66% 66% at 50% 50%, transparent 30%, rgba(4,2,18,.84) 100%);
    opacity:0; transition:opacity .4s;
  }
  .cry-shell:hover .cry-vignette { opacity:1; }

  /* Rain */
  .rain { position:absolute; inset:0; pointer-events:none; opacity:0; transition:opacity .4s; z-index:1; overflow:hidden; }
  .cry-shell:hover .rain { opacity:1; }
  .raindrop {
    position:absolute; top:-30px; width:1px;
    background: linear-gradient(180deg, transparent, rgba(147,197,253,.55), transparent);
    animation: rainFall var(--rdur,1s) linear infinite var(--rdelay,0s);
    border-radius:2px;
  }
  @keyframes rainFall { to { transform:translateY(260px); opacity:0; } }

  /* ── REWARD BADGE 🎁 ── */
  .reward-badge {
    position: absolute; bottom: 14px; right: 14px;
    font-size: 38px; z-index: 6;
    transition: transform .4s cubic-bezier(.34,1.56,.64,1), filter .4s ease;
    animation: badgeFloat 3s ease-in-out infinite;
    will-change: transform;
  }
  @keyframes badgeFloat {
    0%,100% { transform: translateY(0) rotate(-5deg) scale(1); }
    50%      { transform: translateY(-8px) rotate(5deg) scale(1.05); }
  }
  .gcard.normal .reward-badge { filter: drop-shadow(0 0 10px rgba(34,197,94,.65)); }
  .gcard.vip    .reward-badge { filter: drop-shadow(0 0 12px rgba(251,191,36,.75)); }

  .gcard:hover .reward-badge { transform: scale(1.5) translateY(-6px) !important; animation: none; }
  .gcard.normal:hover .reward-badge { filter: drop-shadow(0 0 28px rgba(34,197,94,1)) drop-shadow(0 0 52px rgba(34,197,94,.45)); }
  .gcard.vip:hover    .reward-badge { filter: drop-shadow(0 0 32px rgba(251,191,36,1)) drop-shadow(0 0 60px rgba(251,191,36,.5)); }

  /* Spark particles around badge on hover */
  .badge-sparks {
    position: absolute; bottom: 8px; right: 8px;
    width: 64px; height: 64px; z-index: 5;
    pointer-events: none; opacity: 0; transition: opacity .3s;
  }
  .gcard:hover .badge-sparks { opacity: 1; }
  .sp {
    position: absolute; width: 5px; height: 5px; border-radius: 50%;
    animation: spFly var(--pd,1.2s) ease-out infinite var(--ps,0s);
  }
  .gcard.normal .sp { background: #4ade80; }
  .gcard.vip    .sp { background: #fbbf24; }
  @keyframes spFly {
    0%   { transform: translate(32px,32px) scale(0); opacity:0; }
    15%  { opacity:1; transform: translate(calc(32px + var(--px,0px)), calc(32px + var(--py,0px))) scale(1.2); }
    80%  { opacity:.5; }
    100% { transform: translate(calc(32px + var(--px,0px)*2.2), calc(32px + var(--py,0px)*2.2)) scale(0); opacity:0; }
  }

  /* ── TIER RIBBON ── */
  .tier-ribbon {
    position: absolute;
    top: 18px;
    left: -6px;
    padding: 4px 14px 4px 12px;
    font-size: 9px;
    font-weight: 800;
    letter-spacing: .14em;
    text-transform: uppercase;
    border-radius: 0 4px 4px 0;
    z-index: 15;
    clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, 6px 50%);
    padding-left: 18px;
  }
  .tier-ribbon.unlucky { background: rgba(109,40,217,.8); color: #c4b5fd; border: 1px solid rgba(167,139,250,.3); }
  .tier-ribbon.normal  { background: rgba(21,128,61,.85); color: #86efac; border: 1px solid rgba(34,197,94,.3); }
  .tier-ribbon.vip     { background: linear-gradient(90deg,#92400e,#b45309); color: #fcd34d; border: 1px solid rgba(251,191,36,.4); }

  /* ── BODY ── */
  .card-body {
    padding: 18px 20px 20px;
    position: relative;

  }

  /* Decorative top line */
  .card-body::before {
    content: '';
    display: block;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(139,92,246,.5), transparent);
    margin-bottom: 16px;
  }

  .card-title {
    font-family: 'Syne', sans-serif;
    font-size: 18px;
    font-weight: 800;
    color: #e8e0ff;
    margin-bottom: 4px;
    letter-spacing: -.01em;
    transition: color .3s;
  }
  .gcard.vip .card-title { color: var(--gold); }
  .gcard:hover .card-title { color: #fff; }

  .card-amount {
    font-size: 22px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    margin-bottom: 12px;
    background: linear-gradient(90deg, #a78bfa, #818cf8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .gcard.vip .card-amount {
    background: linear-gradient(90deg, #fbbf24, #f59e0b, #fcd34d);
    -webkit-background-clip: text;
    background-clip: text;
  }
  .gcard.normal .card-amount {
    background: linear-gradient(90deg, #4ade80, #22c55e);
    -webkit-background-clip: text;
    background-clip: text;
  }

  .status-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    font-weight: 600;
  }
  .status-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .status-redeemed .status-dot { background: #22c55e; box-shadow: 0 0 6px #22c55e; }
  .status-declined .status-dot { background: #6b7280; }
  .status-redeemed { color: #4ade80; }
  .status-declined { color: #6b7280; }

  /* ── CAPTION ── */
  .box-caption {
    text-align: center;
    margin-top: 16px;
  }
  .box-caption-title {
    font-family: 'Syne', sans-serif;
    font-size: 18px;
    font-weight: 800;
    color: #e8e0ff;
    letter-spacing: -.01em;
  }
  .box-caption-sub {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 3px;
    letter-spacing: .02em;
  }

  /* Particles on hover */
  .particles {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 20;
    opacity: 0;
    transition: opacity .3s;
  }
  .gcard:hover .particles { opacity: 1; }
  .particle {
    position: absolute;
    width: 4px; height: 4px;
    border-radius: 50%;
    background: var(--purple-light);
    animation: particleFly var(--pdur, 1.5s) ease-out infinite var(--pdelay, 0s);
  }
  @keyframes particleFly {
    0%   { transform: translate(0,0) scale(1); opacity: .8; }
    100% { transform: translate(var(--px,20px), var(--py,-60px)) scale(0); opacity: 0; }
  }

  /* Glow pulse ring */
  .glow-ring {
    position: absolute;
    inset: -2px;
    border-radius: 22px;
    opacity: 0;
    transition: opacity .4s;
    pointer-events: none;
    z-index: -1;
  }
  .gcard.unlucky .glow-ring { box-shadow: 0 0 40px 8px rgba(109,40,217,.4); }
  .gcard.normal  .glow-ring { box-shadow: 0 0 40px 8px rgba(34,197,94,.35); }
  .gcard.vip     .glow-ring { box-shadow: 0 0 40px 12px rgba(251,191,36,.4); }
  .gcard:hover .glow-ring { opacity: 1; }

  /* VIP shimmer border */
  .gcard.vip {
    border-color: rgba(251,191,36,.4);
  }
  .gcard.vip::before {
    content: '';
    position: absolute;
    inset: -1px;
    border-radius: 21px;
    background: linear-gradient(135deg, rgba(251,191,36,.3), transparent 40%, rgba(251,191,36,.15) 70%, transparent);
    z-index: 0;
    pointer-events: none;
    transition: opacity .4s;
    opacity: .6;
  }
  .gcard.vip:hover::before { opacity: 1; }

  /* Wrap */
  .box-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
</style>
</head>
<body>

<!-- Stars -->
<div class="stars" id="stars"></div>

<div class="scene" id="scene"></div>

<script>
/* ── Generate stars ── */
const starsEl = document.getElementById('stars');
for (let i = 0; i < 60; i++) {
  const s = document.createElement('div');
  s.className = 'star';
  const size = Math.random() * 2.5 + .5;
  s.style.cssText = `
    width:${size}px;height:${size}px;
    top:${Math.random()*100}%;left:${Math.random()*100}%;
    --dur:${2+Math.random()*4}s;
    --delay:-${Math.random()*5}s;
  `;
  starsEl.appendChild(s);
}

/* ── Data ── */
const boxes = [
  {
    id: 1,
    tier: 'unlucky',
    tierLabel: 'UNLUCKY RESULT',
    title: 'Chúc bạn may mắn lần sau',
    subtitle: 'Hộp tiếp theo có thể sẽ mang đến bất ngờ lớn hơn',
    amount: null,
    imgSrc: null,
    emoji: '😭',
    status: null,
    captionTitle: 'Hộp 1',
    captionSub: 'Đã mở - Unlucky',
  },
  {
    id: 2,
    tier: 'normal',
    tierLabel: 'NORMAL TIER',
    title: 'iPhone 16 Pro',

/* ── Cry content: emoji 😭 only ── */
function cryFaceSVG() {
  return `<span class="cry-emoji">😭</span>`;
}


function makeParticles(tier) {
  const colors = {
    unlucky: ['#a78bfa','#7c3aed','#c4b5fd'],
    normal:  ['#4ade80','#22c55e','#86efac'],
    vip:     ['#fbbf24','#f59e0b','#fcd34d'],
  }[tier];
  let html = '';
  for (let i = 0; i < 12; i++) {
    const c = colors[i % colors.length];
    const px = (Math.random() - .5) * 120;
    const py = -(30 + Math.random() * 80);
    const left = 10 + Math.random() * 80;
    const top  = 20 + Math.random() * 60;
    html += `<div class="particle" style="
      left:${left}%;top:${top}%;
      background:${c};
      --px:${px}px;--py:${py}px;
      --pdur:${1+Math.random()}s;
      --pdelay:-${Math.random()*1.5}s;
    "></div>`;
  }
  return html;
}

/* ── Render ── */
const scene = document.getElementById('scene');

boxes.forEach(b => {
  const imgContent = b.tier === 'unlucky'
    ? `<div class="cry-shell">
        <div class="rain" id="rain-${b.id}"></div>
        <div class="cry-vignette"></div>
        ${cryFaceSVG()}
        <div class="cry-puddle"></div>
      </div>`
    : b.imgSrc
    ? `<img src="${b.imgSrc}" alt="${b.title}"
          onerror="this.onerror=null;this.style.display='none';this.nextElementSibling.style.display='flex';">
       <div class="emoji-fallback" style="display:none">${b.emoji}</div>
       <div class="img-glow"></div>
       <div class="img-scan"></div>`
    : `<div class="emoji-fallback">${b.emoji}</div>`;

  const sparkDots = Array.from({length:8}, (_,i) => {
    const angle = i * 45 * Math.PI / 180;
    const px = Math.round(Math.cos(angle) * 22);
    const py = Math.round(Math.sin(angle) * 22);
    return `<div class="sp" style="--px:${px}px;--py:${py}px;--pd:${0.9+Math.random()*.5}s;--ps:-${(Math.random()*.9).toFixed(2)}s"></div>`;
  }).join('');

  const rewardBadge = b.imgSrc ? `<div class="badge-sparks">${sparkDots}</div><div class="reward-badge">🎁</div>` : '';

  const amountHtml = b.amount
    ? `<div class="card-amount">${b.amount}</div>` : '';

  const subtitleHtml = b.subtitle
    ? `<div style="font-size:13px;color:#9090b0;margin-bottom:12px;line-height:1.5">${b.subtitle}</div>` : '';

  let statusHtml = '';
  if (b.status === 'redeemed') {
    statusHtml = `<div class="status-row status-redeemed"><div class="status-dot"></div>${b.statusLabel}</div>`;
  } else if (b.status === 'declined') {
    statusHtml = `<div class="status-row status-declined"><div class="status-dot"></div>${b.statusLabel}</div>`;
  }

  const wrap = document.createElement('div');
  wrap.className = 'box-wrap';
  wrap.dataset.box = b.id;
  wrap.innerHTML = `
    <div class="gcard ${b.tier}">
      <div class="glow-ring"></div>
      <div class="chip">Đã mở</div>
      <div class="tier-ribbon ${b.tier}">${b.tierLabel}</div>
      <div class="particles">${makeParticles(b.tier)}</div>

      <div class="img-shell">
        ${imgContent}
        ${rewardBadge}

      </div>

      <div class="card-body">
        <div class="card-title">${b.title}</div>
        ${amountHtml}
        ${subtitleHtml}
        ${statusHtml}
      </div>
    </div>
    <div class="box-caption">
      <div class="box-caption-title">${b.captionTitle}</div>
      <div class="box-caption-sub">${b.captionSub}</div>
    </div>
  `;
  scene.appendChild(wrap);
});

/* Generate rain drops for unlucky card */
const rainEl = document.getElementById('rain-1');
if (rainEl) {
  for (let i = 0; i < 22; i++) {
    const d = document.createElement('div');
    d.className = 'raindrop';
    const h = 16 + Math.random() * 28;
    d.style.cssText = `
      left:${4+Math.random()*92}%;
      height:${h}px;
      --rdur:${.45+Math.random()*.5}s;
      --rdelay:-${Math.random()*1.2}s;
    `;
    rainEl.appendChild(d);
  }
}

/* done */
